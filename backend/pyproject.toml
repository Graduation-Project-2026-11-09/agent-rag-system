[project]
name = "ai-helpdesk-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.1",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "argon2-cffi>=25.1",
    "boto3>=1.40",
    "openai>=1.100",
    "pypdf>=6.21.4,<7",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic が自動生成するファイルは対象外
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
