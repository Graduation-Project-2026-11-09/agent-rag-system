# main にマージされたら、テスト → イメージを GHCR に push する。
# stg の EC2 が 2 分ごとに GHCR を確認し、新しいイメージに入れ替える（deploy/stg/deploy.sh）。
# AWS の鍵は GitHub に置かない（アカウントの制限で OIDC が使えないため、EC2 側から取りに行く方式）。
name: Deploy (stg)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stg
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: agent-rag-api
            context: backend
          - image: agent-rag-web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          target: prod
          push: true
          tags: |
            ghcr.io/graduation-project-2026-11-09/${{ matrix.image }}:main
            ghcr.io/graduation-project-2026-11-09/${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
